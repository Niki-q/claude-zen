<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude</title>
    <style>
      :root {
        --bg-100: hsl(48 33.3% 97.1%);
        --text-100: #141413;
        --text-300: #3d3d3a;
        --accent: #d97757;
        --border: rgba(31, 30, 29, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-100: hsl(60 2.7% 14.5%);
          --text-100: hsl(48 33% 97%);
          --text-300: hsl(60 2.5% 66.5%);
          --border: rgba(255, 255, 255, 0.12);
        }
      }
      html, body { height: 100%; }
      body {
        background: var(--bg-100);
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      .dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.5);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.45); }
        50% { opacity: 1; box-shadow: 0 0 0 10px rgba(217, 119, 87, 0); }
      }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
      p {
        color: var(--text-300);
        font-size: 15px;
        line-height: 1.4;
        margin: 0;
        max-width: 320px;
      }
      strong { color: var(--text-100); font-weight: 600; }
      button {
        appearance: none;
        border: 0.5px solid var(--border);
        background: transparent;
        color: var(--text-100);
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: rgba(217, 119, 87, 0.12); }
    </style>
  </head>
  <body>
    <div class="dot" aria-hidden="true"></div>
    <p><strong>Claude is working in the background.</strong><br />
      You've switched to a tab outside Claude's working group.</p>
    <button id="open-chat" type="button">Back to Claude's tab</button>
    <script src="firefox-idle-panel.js"></script>
  </body>
</html>
